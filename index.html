<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K THE GOAT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: light monochrome editorial grid. Wide black grotesque (Balenciaga / Fear of God restraint),
   mono HUD labels for the tech layer, one chrome 3D signature at the top and the bottom. */
:root{
  --ink:#0b0b0b; --ink-2:#4d4d4a; --ink-3:#8a8a86; --line:rgba(11,11,11,.13); --line-2:rgba(11,11,11,.32);
  --p1:#f1f1ef; --p2:#e7e7e5; --p3:#f8f8f7; --p4:#dcdcda;
  --f-sans:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --nav-h:64px; --vh:100vh;
}
@supports (height:100svh){:root{--vh:100svh}}
*{box-sizing:border-box}
body{margin:0;background:var(--p1);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.label{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1.35}
.wrap{padding-left:var(--gl);padding-right:var(--gr)}
.disp{margin:0;font-weight:800;font-stretch:125%;text-transform:uppercase;letter-spacing:-.035em;line-height:.92;text-wrap:balance}
.ln{display:block;overflow:hidden;padding:.2em 0 .1em;margin:-.2em 0 -.1em}
:root[lang=vi] .disp{line-height:1.02}
.ln>span{display:block}
.wd{display:inline-block;white-space:nowrap}
.c{display:inline-block;will-change:transform}
.gimg{filter:grayscale(1) contrast(1.06)}
.eyebrow{display:flex;gap:14px;align-items:center;color:var(--ink-2)}
.eyebrow::after{content:"";flex:0 0 48px;height:1px;background:currentColor}

/* overlays */
.grain{position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:.07;mix-blend-mode:multiply;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-4%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.guides{position:fixed;inset:0;z-index:55;pointer-events:none;display:flex;justify-content:space-between;padding:0 var(--gr) 0 var(--gl)}
.guides i{width:1px;background:rgba(11,11,11,.045)}

/* loader */
#loader{position:fixed;inset:0;z-index:100;background:var(--p1);display:grid;grid-template-rows:auto 1fr auto;padding:calc(24px + env(safe-area-inset-top,0px)) var(--gr) calc(24px + env(safe-area-inset-bottom,0px)) var(--gl);transition:clip-path 1.1s cubic-bezier(.76,0,.24,1);clip-path:inset(0 0 0 0)}
#loader.done{clip-path:inset(0 0 100% 0);pointer-events:none}
#loader .top,#loader .bot{display:flex;justify-content:space-between;gap:16px;color:var(--ink-2)}
#loader .count{align-self:end;font-weight:800;font-stretch:125%;font-size:clamp(72px,17vw,260px);letter-spacing:-.05em;line-height:.8;font-variant-numeric:tabular-nums;margin-bottom:20px}
#loader .bar{height:1px;background:var(--line);margin-bottom:14px;overflow:hidden}
#loader .bar i{display:block;height:100%;background:var(--ink);transform-origin:left;transform:scaleX(0)}

/* nav + hud */
.nav{position:fixed;z-index:80;top:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) var(--gr) 0 var(--gl);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;pointer-events:none}
.nav>*{pointer-events:auto}
.nav::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(241,241,239,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);opacity:0;transition:opacity .4s}
.nav.solid::before{opacity:1}
.brand{justify-self:start;font-weight:800;font-stretch:125%;letter-spacing:-.02em;font-size:16px;text-decoration:none;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.brand b{display:inline-block;width:9px;height:9px;background:var(--ink);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0}
.nav ul a{text-decoration:none;display:inline-flex;overflow:hidden;height:1.35em}
.roll{display:inline-flex;flex-direction:column;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.roll>span{display:block;height:1.35em}
@media (hover:hover){a:hover .roll,button:hover .roll{transform:translateY(-50%)}}
.lang{justify-self:end;display:flex;gap:14px;align-items:center}
.lang button{opacity:.4;transition:opacity .2s;padding:6px 0}
.lang button[aria-pressed="true"]{opacity:1}
.lang button[aria-pressed="true"]::before{content:"[";}
.lang button[aria-pressed="true"]::after{content:"]";}
.clock{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.hud{position:fixed;z-index:80;left:var(--gl);right:var(--gr);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;pointer-events:none;color:var(--ink-2);opacity:0;transition:opacity .5s}
.hud.on{opacity:1}
.hud span{font-variant-numeric:tabular-nums}

/* hero */
.hero{position:relative;z-index:1;height:var(--vh);min-height:560px;overflow:hidden;background:var(--p1)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(11,11,11,.16) 1px,transparent 1.2px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 20%,transparent 75%)}
.bezel{position:absolute;inset:0;margin:auto;width:min(84vh,94vw);height:min(84vh,94vw);color:var(--ink);opacity:.5}
.bezel svg{width:100%;height:100%;display:block;animation:spin 140s linear infinite}
.shadow{position:absolute;left:50%;top:63%;width:min(70vw,1100px);height:60px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(11,11,11,.22),transparent 68%);filter:blur(8px)}
#c-hero{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-fallback{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(48px,11vw,190px);transition:opacity .6s}
.gl-ready .hero-fallback{opacity:0}
.hc{position:absolute;display:grid;gap:4px}
.hc.tl{left:var(--gl);top:calc(var(--nav-h) + 28px + env(safe-area-inset-top,0px))}
.hc.tr{right:var(--gr);top:calc(var(--nav-h) + 28px + env(safe-area-inset-top,0px));text-align:right}
.hc.bl{left:var(--gl);bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.hc.bc{left:0;right:0;margin:0 auto;width:max-content;bottom:calc(30px + env(safe-area-inset-bottom,0px));text-align:center;white-space:nowrap}
.hc.br{right:var(--gr);bottom:calc(30px + env(safe-area-inset-bottom,0px));text-align:right}
.hc .mut{color:var(--ink-3)}
.scrollcue{display:flex;align-items:center;gap:12px}
.scrollcue i{display:block;width:1px;height:38px;background:var(--line);position:relative;overflow:hidden}
.scrollcue i::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--ink);animation:cue 1.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes cue{to{top:100%}}

/* about (covers the pinned hero) */
.about{position:relative;z-index:2;background:var(--p3);will-change:clip-path}
.mq{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);padding-block:clamp(10px,1.6vh,18px)}
.mq-track{display:inline-flex;will-change:transform}
.mq-item{display:inline-flex;align-items:center;gap:.4em;padding-right:.4em;font-weight:800;font-stretch:125%;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(44px,8.5vw,150px);line-height:1}
.mq-item svg{width:.42em;height:.42em;flex:none}
.mq.out .mq-item{color:transparent;-webkit-text-stroke:1.2px var(--ink)}
.st{padding-block:clamp(90px,16vh,190px) clamp(70px,12vh,140px)}
.st-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:56px;align-items:start}
.st-head{grid-column:1 / span 8;display:grid;gap:clamp(24px,4vh,44px)}
.st-title{font-size:clamp(38px,7.2vw,132px)}
.st-fig{grid-column:9 / span 4;grid-row:1 / span 2;margin:0;position:relative}
.polywrap{position:relative}
.outline{position:absolute;inset:0;width:100%;height:100%;transform:translate(14px,14px);overflow:visible;pointer-events:none}
.outline polygon{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.st-poly{position:relative;aspect-ratio:4/5;overflow:hidden;background:#cfcfcd;clip-path:polygon(0% 12%,70% 0%,100% 0%,100% 100%,30% 100%,0% 64%)}
.st-poly img{width:100%;height:118%;object-fit:cover;object-position:50% 18%}
.figcap{display:flex;justify-content:space-between;margin-top:30px;color:var(--ink-2)}
.st-copy{grid-column:1 / span 6;display:grid;gap:26px;max-width:600px}
.st-copy p{margin:0;font-size:clamp(18px,1.55vw,24px);line-height:1.42;font-weight:500;letter-spacing:-.005em}
.st-copy .w{display:inline-block;white-space:pre}
.st-copy .sub{color:var(--ink-2);font-size:clamp(15px,1.15vw,18px);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);margin-top:clamp(70px,12vh,140px)}
.stat{padding:22px 20px 26px 0;display:grid;gap:14px;align-content:start}
.stat+.stat{border-left:1px solid var(--line);padding-left:20px}
.stat .v{font-weight:800;font-stretch:125%;letter-spacing:-.04em;font-size:clamp(44px,6.4vw,112px);line-height:.9;font-variant-numeric:tabular-nums}
.stat .label{color:var(--ink-2);max-width:24ch}

/* brands */
.brands{position:relative;z-index:2;background:linear-gradient(var(--p3) 0 80%,var(--p1));padding-block:clamp(40px,8vh,90px) clamp(90px,16vh,180px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:clamp(36px,6vh,72px)}
.sec-head .disp{font-size:clamp(34px,5.6vw,100px)}
.sec-head .label{color:var(--ink-2);text-align:right;max-width:30ch}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.bcell{position:relative;aspect-ratio:1.18;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;text-decoration:none;isolation:isolate}
.bcell::before{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleY(0);transform-origin:bottom;transition:transform .55s cubic-bezier(.7,0,.2,1);z-index:-1}
.bcell img{width:56%;height:42%;object-fit:contain;transition:transform .55s cubic-bezier(.2,.7,.2,1),filter .3s}
.bcell .y,.bcell .k{position:absolute;bottom:14px;transition:color .3s}
.bcell .y{left:14px}.bcell .k{right:14px;color:var(--ink-3);text-align:right}
.bcell .i{position:absolute;top:14px;left:14px;color:var(--ink-3);transition:color .3s}
.bcell.cta{flex-direction:column;gap:14px;text-align:center;padding:16px}
.bcell.cta .q{font-weight:800;font-stretch:125%;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(18px,1.8vw,30px);line-height:1;transition:color .3s}
.bcell.cta .arr{width:40px;height:40px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;transition:transform .5s,border-color .3s}
@media (hover:hover){
  .bcell:hover::before{transform:scaleY(1)}
  .bcell:hover img{filter:invert(1);transform:scale(1.08)}
  .bcell:hover .y,.bcell:hover .k,.bcell:hover .i,.bcell:hover .q{color:var(--p3)}
  .bcell.cta:hover .arr{transform:rotate(-45deg);border-color:var(--p3);color:var(--p3)}
}

/* work */
.work{position:relative;z-index:2;background:var(--p1)}
.work-pin{position:relative;height:var(--vh);min-height:600px;overflow:hidden;background:var(--p1)}
.bgnames{position:absolute;left:0;top:50%;transform:translateY(-58%);width:100%;pointer-events:none}
.bgname{position:absolute;left:0;top:0;white-space:nowrap;font-weight:800;font-stretch:125%;text-transform:uppercase;letter-spacing:-.04em;line-height:.85;font-size:clamp(120px,22vw,400px);color:transparent;-webkit-text-stroke:1px var(--line-2);opacity:.75}
.work-head{position:absolute;left:var(--gl);right:var(--gr);top:calc(var(--nav-h) + 22px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;color:var(--ink-2)}
.work-count{font-variant-numeric:tabular-nums}
.work-count b{color:var(--ink);font-weight:500}
.stage{position:absolute;right:calc(var(--gr) + 14px);top:50%;transform:translateY(-50%);height:min(66vh,680px);aspect-ratio:4/5;max-width:44vw}
.stage .outline{transform:translate(14px,14px)}
.shape{position:absolute;inset:0;overflow:hidden;will-change:clip-path;background:#cfcfcd}
.shape img{width:100%;height:100%;object-fit:cover}
.ch{position:absolute;left:var(--gl);bottom:15vh;width:min(46vw,700px)}
.ch-top{display:flex;align-items:center;gap:18px;margin-bottom:22px;color:var(--ink-2)}
.ch-logo{height:clamp(30px,4.2vh,48px);width:auto;max-width:150px;object-fit:contain;object-position:left center}
.ch-name{margin:0 0 18px;font-size:clamp(34px,5.4vw,96px)}
.ch-role{margin:0 0 14px}
.ch-desc{margin:0;max-width:44ch;color:var(--ink-2);font-size:clamp(15px,1.15vw,18px);line-height:1.5}
.ticks{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(5vh + 26px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
.tick{flex:1;display:grid;gap:8px;color:var(--ink-3);transition:color .3s}
.tick i{display:block;height:1px;background:var(--line-2);position:relative;overflow:hidden}
.tick i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(var(--f,0));transform-origin:left}
.tick.on{color:var(--ink)}

/* tunnel */
.tun{position:relative;z-index:2;background:linear-gradient(var(--p1),var(--p4) 25%,var(--p4) 75%,var(--p2))}
.tun-pin{position:relative;height:var(--vh);min-height:520px;overflow:hidden}
#tunCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tun-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:0 var(--gr) 0 var(--gl)}
.tun-text .disp{font-size:clamp(34px,7vw,124px)}
.tun-text .label{color:var(--ink-2)}

/* team */
.team{position:relative;z-index:2;background:var(--p2)}
.team-pin{position:relative;height:var(--vh);min-height:600px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:4vh;padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px))}
.team-head{display:flex;justify-content:space-between;align-items:end;gap:24px}
.team-head .disp{font-size:clamp(34px,6vw,104px)}
.team-head .label{color:var(--ink-2);text-align:right}
.strip{display:flex;gap:clamp(14px,2vw,32px);padding-left:var(--gl);padding-right:var(--gr);width:max-content;will-change:transform}
.strip figure{margin:0;flex:none;display:grid;gap:10px}
.strip .ph{overflow:hidden;clip-path:polygon(0 0,100% 0,100% 90%,92% 100%,0 100%)}
.strip img{height:clamp(200px,44vh,500px);width:auto;max-width:none;transform-origin:center}
.strip figcaption{display:flex;justify-content:space-between;color:var(--ink-3)}
.strip figure:nth-child(even){margin-top:clamp(20px,6vh,70px)}

/* skills */
.skills{position:relative;z-index:2;background:linear-gradient(var(--p2),var(--p3) 30%);padding-block:clamp(100px,18vh,200px)}
.sk{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.sk li{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;align-items:center;padding:clamp(16px,2.6vh,28px) 0;border-bottom:1px solid var(--line);position:relative}
.sk li::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.7,0,.2,1)}
.sk .n{display:block;overflow:hidden;height:1.06em;font-weight:800;font-stretch:125%;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(22px,3.6vw,60px);line-height:1.06}
.sk .n .roll>span{height:1.06em}
.sk .d{color:var(--ink-2);font-size:clamp(14px,1.1vw,17px)}
@media (hover:hover){.sk li:hover::after{transform:scaleX(1)}.sk li:hover .roll{transform:translateY(-50%)}}
.sk-prev{position:fixed;left:0;top:0;z-index:70;width:clamp(180px,16vw,260px);aspect-ratio:4/5;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .3s,transform .4s cubic-bezier(.2,.7,.2,1);clip-path:polygon(10% 0,100% 0,100% 82%,84% 100%,0 100%,0 14%)}
.sk-prev.on{opacity:1}
.sk-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.sk-prev img.on{opacity:1}

/* contact */
.contact{position:relative;z-index:2;background:linear-gradient(var(--p3),var(--p1) 40%);padding-top:clamp(60px,10vh,120px)}
.contact .ct-title{font-size:clamp(40px,9.6vw,176px)}
.c-rows{margin-top:clamp(48px,9vh,110px);border-top:1px solid var(--line)}
.c-row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr) auto;gap:24px;align-items:center;padding:clamp(18px,3vh,32px) 0;border-bottom:1px solid var(--line)}
.c-row .label{color:var(--ink-2)}
.c-val{font-weight:800;font-stretch:122%;letter-spacing:-.025em;font-size:clamp(20px,3.4vw,54px);line-height:1.05;overflow-wrap:anywhere;user-select:all;text-decoration:none}
.c-row .go{display:flex;gap:10px}
.pill{text-transform:inherit;letter-spacing:inherit;font-family:inherit;display:inline-flex;align-items:center;height:38px;padding:0 16px;border:1px solid var(--line-2);border-radius:99px;text-decoration:none;overflow:hidden;transition:background .3s,color .3s}
.pill .roll>span{height:38px;line-height:38px}
.pill .roll{height:38px}
@media (hover:hover){.pill:hover{background:var(--ink);color:var(--p3)}}
.mq.big{border-top:1px solid var(--line);margin-top:clamp(60px,10vh,120px)}
.foot{position:relative;height:clamp(260px,52vh,520px)}
#c-foot{position:absolute;inset:0;width:100%;height:100%;display:block}
.foot-fallback{position:absolute;inset:0;margin:0;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,10vw,170px)}
.gl2-ready .foot-fallback{opacity:0}
.foot-meta{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;color:var(--ink-2);gap:12px}

@media (max-width:820px){
  :root{--nav-h:56px}
  .nav{grid-template-columns:auto 1fr auto}
  .nav ul,.clock,.guides,.hud{display:none}
  .hc.bc{display:none}
  .st-head{grid-column:1 / -1}
  .st-fig{grid-column:2 / span 10;grid-row:auto}
  .st-copy{grid-column:1 / -1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0;padding-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bcell .i{display:none}
  .bcell .k{top:12px;right:12px;bottom:auto;font-size:9px;max-width:70%}
  .bcell .y{left:12px;bottom:12px}
  .sec-head{flex-direction:column;align-items:flex-start;gap:12px}
  .sec-head .label{text-align:left}
  .stage{left:var(--gl);right:var(--gr);width:auto;max-width:none;top:calc(var(--nav-h) + 52px + env(safe-area-inset-top,0px));height:40svh;aspect-ratio:auto;transform:none}
  .stage .outline{transform:translate(8px,8px)}
  .ch{left:var(--gl);right:var(--gr);width:auto;bottom:calc(9vh + 22px)}

/* ================= 3D chrome signature ================= */
const SIGN_FONT = px => `expanded 900 ${px}px Archivo`;
function contourLetters(lines, px){
  const padPx = Math.round(px * .14), lineH = px * .98;
  const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
  const setFont = () => { ctx.font = SIGN_FONT(px); if ('fontStretch' in ctx) ctx.fontStretch = 'expanded'; };
  setFont();
  const capH = ctx.measureText('H').actualBoundingBoxAscent || px * .72;
  const widths = lines.map(l => ctx.measureText(l).width);
  const W = Math.ceil(Math.max(...widths)) + padPx * 2, H = Math.ceil(lineH * (lines.length - 1) + capH) + padPx * 2;
  c.width = W; c.height = H; setFont();
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const boxes = [];
  lines.forEach((l, li) => {
    const x0 = (W - widths[li]) / 2, base = padPx + capH + li * lineH;
    ctx.fillText(l, x0, base);
    const chars = Array.from(l);
    let acc = '';
    chars.forEach(chr => { const a = ctx.measureText(acc).width; acc += chr; const b = ctx.measureText(acc).width; if (chr.trim()) boxes.push({ x0: x0 + a, x1: x0 + b, cy: base - capH / 2, li, top: base - capH, bot: base }); });
  });
  const data = ctx.getImageData(0, 0, W, H).data;
  const f = (x, y) => data[(y * W + x) * 4 + 3] / 255, thr = .5;
  const segs = [], adj = new Map();
  const add = (a, b) => { const i = segs.length; segs.push([a, b]); let A = adj.get(a); if (!A) adj.set(a, A = []); A.push(i); let B = adj.get(b); if (!B) adj.set(b, B = []); B.push(i); };
  const hE = (x, y) => (y * W + x) * 2, vE = (x, y) => (y * W + x) * 2 + 1;
  for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) {
    const tl = f(x, y), tr = f(x + 1, y), br = f(x + 1, y + 1), bl = f(x, y + 1);
    const k = (tl > thr ? 8 : 0) | (tr > thr ? 4 : 0) | (br > thr ? 2 : 0) | (bl > thr ? 1 : 0);
    if (k === 0 || k === 15) continue;
    const T_ = hE(x, y), B_ = hE(x, y + 1), L_ = vE(x, y), R_ = vE(x + 1, y);
    switch (k) {
      case 1: case 14: add(L_, B_); break;
      case 2: case 13: add(B_, R_); break;
      case 3: case 12: add(L_, R_); break;
      case 4: case 11: add(T_, R_); break;
      case 6: case 9: add(T_, B_); break;
      case 7: case 8: add(T_, L_); break;
      case 5: case 10: { const m = (tl + tr + br + bl) / 4 > thr; const same = (k === 5) === m; if (same) { add(T_, L_); add(R_, B_); } else { add(T_, R_); add(L_, B_); } break; }
    }
  }
  const pos = id => { const idx = id >> 1, x = idx % W, y = (idx / W) | 0; if ((id & 1) === 0) { const a = f(x, y), b = f(x + 1, y); return [x + (thr - a) / (b - a), y]; } const a = f(x, y), b = f(x, y + 1); return [x, y + (thr - a) / (b - a)]; };
  const used = new Uint8Array(segs.length), loops = [];
  for (let s = 0; s < segs.length; s++) {
    if (used[s]) continue; used[s] = 1;
    const ids = [segs[s][0]]; let cur = segs[s][1], guard = 0;
    while (cur !== segs[s][0] && guard++ < 400000) { ids.push(cur); const nx = (adj.get(cur) || []).find(i => !used[i]); if (nx === undefined) break; used[nx] = 1; cur = segs[nx][0] === cur ? segs[nx][1] : segs[nx][0]; }
    if (ids.length > 8) loops.push(ids.map(pos));
  }
  const dpOpen = (p, eps) => { const keep = new Uint8Array(p.length); keep[0] = keep[p.length - 1] = 1; const st = [[0, p.length - 1]]; while (st.length) { const [a, b] = st.pop(); const [x1, y1] = p[a], [x2, y2] = p[b]; const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1; let md = 0, mi = -1; for (let i = a + 1; i < b; i++) { const d = Math.abs(dy * p[i][0] - dx * p[i][1] + x2 * y1 - y2 * x1) / len; if (d > md) { md = d; mi = i; } } if (md > eps && mi > 0) { keep[mi] = 1; st.push([a, mi], [mi, b]); } } return p.filter((_, i) => keep[i]); };
  const simplify = (p, eps) => { const h = p.length >> 1; const A = dpOpen(p.slice(0, h + 1), eps), B = dpOpen(p.slice(h).concat([p[0]]), eps); return A.slice(0, -1).concat(B.slice(0, -1)); };
  const area = p => { let a = 0; for (let i = 0, j = p.length - 1; i < p.length; j = i++) a += p[j][0] * p[i][1] - p[i][0] * p[j][1]; return a / 2; };
  const inside = (pt, q) => { let r = false; for (let i = 0, j = q.length - 1; i < q.length; j = i++) { const [xi, yi] = q[i], [xj, yj] = q[j]; if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) r = !r; } return r; };
  const L = loops.map(p => simplify(p, .4)).filter(p => p.length > 3 && Math.abs(area(p)) > 8);
  const depth = L.map((p, i) => L.reduce((d, q, j) => d + (j !== i && inside(p[0], q) ? 1 : 0), 0));
  const unit = px;
  const letters = boxes.map(b => ({ ...b, outers: [] }));
  L.forEach((p, i) => {
    if (depth[i] % 2) return;
    let cx = 0, cy = 0; p.forEach(q => { cx += q[0]; cy += q[1]; }); cx /= p.length; cy /= p.length;
    let best = null, bd = 1e9;
    letters.forEach(l => { if (cy < l.top - px * .3 || cy > l.bot + px * .3) return; const d = cx < l.x0 ? l.x0 - cx : cx > l.x1 ? cx - l.x1 : 0; if (d < bd) { bd = d; best = l; } });
    if (best) best.outers.push({ p, holes: L.filter((q, j) => depth[j] === depth[i] + 1 && inside(q[0], p)) });
  });
  const out = letters.filter(l => l.outers.length).map(l => {
    const cx = (l.x0 + l.x1) / 2, cy = l.cy;
    const conv = p => p.map(([x, y]) => new THREE.Vector2((x - cx) / unit, -(y - cy) / unit));
    const orient = (arr, ccw) => { let a = 0; for (let i = 0, j = arr.length - 1; i < arr.length; j = i++) a += arr[j].x * arr[i].y - arr[i].x * arr[j].y; return (a > 0) === ccw ? arr : arr.reverse(); };
    const shapesL = l.outers.map(o => { const s = new THREE.Shape(orient(conv(o.p), false)); o.holes.forEach(h => s.holes.push(new THREE.Path(orient(conv(h), true)))); return s; });
    return { shapes: shapesL, x: (cx - W / 2) / unit, y: -(cy - H / 2) / unit };
  });
  return { letters: out, w: (Math.max(...widths)) / unit, h: (lineH * (lines.length - 1) + capH) / unit };
}

function makeEnv(renderer){

    st.letters.forEach(L => { Object.assign(L, { iz: -rnd(6, 12), iy: rnd(-1.5, 1.5), irx: rnd(-2.5, 2.5), iry: rnd(-2.5, 2.5), is: .4 }); });

  charsIn($('#stTitle'), { scrollTrigger: { trigger: '#stTitle', start: 'top 85%', once: true } });
  gsap.fromTo($$('.w', $('#stP')), { opacity: .14 }, { opacity: 1, ease: 'none', stagger: .06, scrollTrigger: { trigger: '#stP', start: 'top 85%', end: 'bottom 55%', scrub: true } });
  gsap.fromTo('#stPoly', { clipPath: 'polygon(30% 100%,30% 100%,30% 100%,30% 100%,30% 100%,30% 100%)' }, { clipPath: 'polygon(0% 12%,70% 0%,100% 0%,100% 100%,30% 100%,0% 64%)', ease: 'power2.out', scrollTrigger: { trigger: '#stPoly', start: 'top 95%', end: 'top 35%', scrub: .6 } });
  gsap.fromTo('#stOutline', { attr: { points: '30,100 30,100 30,100 30,100 30,100 30,100' } }, { attr: { points: '0,12 70,0 100,0 100,100 30,100 0,64' }, ease: 'power2.out', scrollTrigger: { trigger: '#stPoly', start: 'top 90%', end: 'top 25%', scrub: 1 } });
  gsap.fromTo('#stPoly img', { yPercent: -12, scale: 1.12 }, { yPercent: 6, scale: 1, ease: 'none', scrollTrigger: { trigger: '#stPoly', start: 'top bottom', end: 'bottom top', scrub: true } });
  initStats();

  /* brands */
  charsIn($('#brTitle'), { scrollTrigger: { trigger: '#brTitle', start: 'top 85%', once: true } });
  gsap.from($$('.bcell', bgrid), { clipPath: 'inset(100% 0 0 0)', duration: 1.1, ease: 'expo.out', stagger: { each: .06, grid: 'auto', from: 'start' }, scrollTrigger: { trigger: bgrid, start: 'top 82%', once: true } });
  gsap.from($$('.bcell img', bgrid), { yPercent: 40, opacity: 0, duration: 1.2, ease: 'expo.out', stagger: .06, delay: .15, scrollTrigger: { trigger: bgrid, start: 'top 82%', once: true } });

  initWork();
  initTunnel();
  initTeam();

  /* skills */
  charsIn($('#skTitle'), { scrollTrigger: { trigger: '#skTitle', start: 'top 85%', once: true } });
  $$('#skList li').forEach(li => gsap.from(li, { opacity: 0, y: 30, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: li, start: 'top 94%', once: true } }));
  initSkillPreview();

  /* contact */
  ScrollTrigger.create({ trigger: '#ctTitle', start: 'top 85%', once: true, onEnter: scrambleTitle });
  ScrollTrigger.create({ trigger: '#contact', start: 'top 160%', once: true, onEnter: initFoot });

  /* HUD */
  const nav = $('.nav'), hud = $('#hud'), hudSec = $('#hudSec'), hudPos = $('#hudPos');
  const secs = $$('[data-sec]'); let curSec = 'hero';
  secs.forEach(s => ScrollTrigger.create({ trigger: s, start: 'top 50%', end: 'bottom 50%', onToggle: e => { if (e.isActive) curSec = s.dataset.sec; } }));
  gsap.ticker.add(() => {
    const max = ScrollTrigger.maxScroll(window) || 1, pr = clamp(scrollY / max, 0, 1);
    hud.classList.toggle('on', scrollY > innerHeight * .6);
    nav.classList.toggle('solid', scrollY > innerHeight * .9);
    const order = ['hero','about','brands','work','tun','team','skills','contact'];
    hudSec.textContent = `[${pad(order.indexOf(curSec))}] ${T().sec[curSec]}`;
    hudPos.textContent = `X ${pad(Math.round(pointer.x), 4)}  Y ${pad(Math.round(pointer.y), 4)}  —  ${pad(Math.round(pr * 100), 3)}%`;
  });

  initMarquees();
  addEventListener('load', () => ScrollTrigger.refresh());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => ScrollTrigger.refresh());
}

function initStats(){
  $$('#stats .stat').forEach((s, i) => {
    const v = $('.v', s), to = v.dataset.to, suf = v.dataset.suf;
    const m = to.match(/^(\d+)(.*)$/); const prefixRange = to.includes('–');
    gsap.from(s, { opacity: 0, y: 40, duration: 1, ease: 'power3.out', delay: i * .08, scrollTrigger: { trigger: '#stats', start: 'top 88%', once: true } });
    if (prefixRange || !m) return;
    const n = +m[1], width = m[1].length, o = { v: 0 };
    ScrollTrigger.create({ trigger: '#stats', start: 'top 88%', once: true, onEnter: () => gsap.to(o, { v: n, duration: 1.8, ease: 'power3.out', delay: i * .08, onUpdate: () => { v.textContent = pad(Math.round(o.v), width) + suf; } }) });
  });
}

function initWork(){
  const outline = $('#wkOutline');
  shapes.forEach((sh, i) => gsap.set(sh, { clipPath: i === 0 ? poly(POLY[0]) : polyAt(0, 100), zIndex: i + 1 }));
  chEls.forEach((c, i) => gsap.set(c, { autoAlpha: i === 0 ? 1 : 0 }));
  bgEls.forEach((b, i) => gsap.set(b, { autoAlpha: i === 0 ? 1 : 0, xPercent: 0 }));
  const tl = gsap.timeline({ defaults: { ease: 'none' } });
  const STEP = 2.2, FIRST = 1.0;
  for (let i = 1; i < N; i++) {
    const t0 = (i - 1) * STEP + FIRST;
    tl.to(shapes[i - 1], { clipPath: polyAt(100, 0), duration: .75, ease: 'power2.in' }, t0);
    tl.to($$('.ch-top,.ch-name,.ch-role,.ch-desc', chEls[i - 1]), { yPercent: -40, autoAlpha: 0, duration: .45, ease: 'power2.in', stagger: .04 }, t0);
    tl.to(bgEls[i - 1], { autoAlpha: 0, duration: .4 }, t0 + .2);
    tl.set(chEls[i - 1], { autoAlpha: 0 }, t0 + .62);
    tl.to(outline, { attr: { points: pts(POLY[i]) }, duration: 1.1, ease: 'power3.inOut' }, t0 + .15);
    tl.fromTo(shapes[i], { clipPath: polyAt(0, 100) }, { clipPath: poly(POLY[i]), duration: .95, ease: 'power3.out' }, t0 + .45);
    tl.fromTo($('img', shapes[i]), { scale: 1.4, yPercent: 6 }, { scale: 1, yPercent: 0, duration: 1.2, ease: 'power2.out' }, t0 + .45);
    tl.set(chEls[i], { autoAlpha: 1 }, t0 + .62);
    tl.fromTo($$('.ch-top,.ch-name,.ch-role,.ch-desc', chEls[i]), { yPercent: 60, autoAlpha: 0 }, { yPercent: 0, autoAlpha: 1, duration: .55, ease: 'power3.out', stagger: .05 }, t0 + .65);
    tl.fromTo(bgEls[i], { autoAlpha: 0 }, { autoAlpha: 1, duration: .5 }, t0 + .6);
  }
  tl.to({}, { duration: 1 });
  bgEls.forEach((b, i) => { const s = i === 0 ? 0 : (i - 1) * STEP + FIRST; tl.fromTo(b, { xPercent: 4 }, { xPercent: -22, duration: STEP + 1.6, ease: 'none' }, Math.max(0, s - .2)); });
  const cnt = $('#workCount b');
  let last = -1;
  const setIdx = time => {
    const idx = clamp(Math.floor((time - FIRST - .6) / STEP) + 1, 0, N - 1);
    const cont = clamp(time / Math.max(.001, tl.duration()) * N, 0, N);
    tickEls.forEach((t, k) => { t.classList.toggle('on', k === idx); $('i', t).style.setProperty('--f', clamp(cont - k, 0, 1).toFixed(3)); });
    if (idx !== last) { last = idx; cnt.textContent = pad(idx + 1); if (!reduce) gsap.fromTo(cnt, { yPercent: 60, opacity: 0 }, { yPercent: 0, opacity: 1, duration: .4, ease: 'power3.out' }); }
  };
  setIdx(0);
  tl.eventCallback('onUpdate', () => setIdx(tl.time()));
  ScrollTrigger.create({ trigger: '#workPin', start: 'top top', pin: true, scrub: .9, animation: tl, anticipatePin: 1,
    end: () => '+=' + Math.round(tl.duration() * innerHeight * .42) });
}

function initTunnel(){
  const cv = $('#tunCanvas'), ctx = cv.getContext('2d');
  let w = 0, h = 0, prog = 0, boost = 0;
  const rays = Array.from({ length: coarse ? 100 : 200 }, () => ({ a: Math.random() * Math.PI * 2, o: Math.random(), l: .08 + Math.random() * .3, wd: .5 + Math.random() * 1.6 }));
  function resize(){ const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2); w = r.width; h = r.height; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(); }
  function draw(){
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, R = Math.hypot(w, h) / 2, p = prog;
    for (const r of rays) {
      const t = (r.o + p * 1.8) % 1, t2 = Math.min(1, t + r.l * (.3 + t) * (1 + boost));
      const r1 = Math.pow(t, 2.3) * R, r2 = Math.pow(t2, 2.3) * R, c = Math.cos(r.a), s = Math.sin(r.a);
      ctx.strokeStyle = `rgba(11,11,11,${(.06 + .55 * t).toFixed(3)})`; ctx.lineWidth = r.wd * (.4 + t);
      ctx.beginPath(); ctx.moveTo(cx + c * r1, cy + s * r1); ctx.lineTo(cx + c * r2, cy + s * r2); ctx.stroke();
    }
    for (let k = 0; k < 4; k++) { const q = (p * 1.1 + k / 4) % 1; ctx.strokeStyle = `rgba(11,11,11,${((1 - q) * .3).toFixed(3)})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(cx, cy, q * R * .95, q * R * .36, 0, 0, Math.PI * 2); ctx.stroke(); }
  }
  new ResizeObserver(resize).observe(cv); resize();
  gsap.ticker.add(() => { const b = clamp(Math.abs(vel) / 40, 0, 1.5); if (Math.abs(b - boost) > .01) { boost += (b - boost) * .1; draw(); } });
  ScrollTrigger.create({ trigger: '#tunPin', start: 'top top', end: () => '+=' + Math.round(innerHeight * 1.6), pin: true, scrub: true, anticipatePin: 1, onUpdate: s => { prog = s.progress; draw(); } });
  const tl = gsap.timeline({ scrollTrigger: { trigger: '#tunPin', start: 'top 60%', end: () => '+=' + Math.round(innerHeight * 1.1), scrub: .6 } });
  tl.from($$('.c', $('#tunTitle')), { yPercent: 115, rotate: 6, stagger: .02, ease: 'power3.out', duration: 1 })
    .from('.tun-text .label', { opacity: 0, y: 20, duration: .5 }, 0);
}

function initTeam(){
  const s = $('#strip');
  const dist = () => Math.max(0, s.scrollWidth - innerWidth);
  gsap.fromTo(s, { x: 0 }, { x: () => -dist(), ease: 'none', scrollTrigger: { trigger: '#teamPin', start: 'top top', end: () => '+=' + dist(), pin: true, scrub: .7, invalidateOnRefresh: true, anticipatePin: 1 } });
  charsIn($('#teamTitle'), { scrollTrigger: { trigger: '#teamPin', start: 'top 70%', once: true } });
  const imgs = $$('img', s); let sk = 0;
  gsap.ticker.add(() => { const tgt = clamp(vel * .25, -7, 7); sk += (tgt - sk) * .12; if (Math.abs(sk) > .01) imgs.forEach(im => { im.style.transform = `skewX(${(-sk).toFixed(2)}deg) scale(${(1 + Math.abs(sk) * .006).toFixed(3)})`; }); });
  let rf; imgs.forEach(im => { const done = () => { clearTimeout(rf); rf = setTimeout(() => ScrollTrigger.refresh(), 200); }; if (im.complete) done(); else im.addEventListener('load', done, { once: true }); });
}

function initSkillPreview(){
  if (!hover) return;
  const prev = skPrev, imgs = $$('img', prev); let on = false, x = innerWidth / 2, y = innerHeight / 2;
  $$('#skList li').forEach(li => {
    li.addEventListener('pointerenter', () => { on = true; prev.classList.add('on'); imgs.forEach((im, k) => im.classList.toggle('on', k === +li.dataset.i)); });
  });
  skList.addEventListener('pointerleave', () => { on = false; prev.classList.remove('on'); });
  gsap.ticker.add(() => { x += (pointer.x - x) * .14; y += (pointer.y - y) * .14; prev.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%) scale(${on ? 1 : .6}) rotate(${clamp((pointer.x - x) * .05, -8, 8).toFixed(2)}deg)`; });
}

function initMarquees(){
  const list = $$('.mq').map(m => ({ el: m, track: $('.mq-track', m), base: +m.dataset.dir || -1, x: 0, sk: 0 }));
  let dir = 1;
  gsap.ticker.add((t, dt) => {
    if (vel > .3) dir = 1; else if (vel < -.3) dir = -1;
    const k = Math.min(Math.abs(vel) * .06, 5);
    list.forEach(m => {
      const half = m.track.scrollWidth / 2; if (!half) return;
      m.x += m.base * dir * (dt / 1000) * (70 + k * 160);
      if (m.x <= -half) m.x += half; if (m.x > 0) m.x -= half;
      const tgt = clamp(-vel * .12, -10, 10); m.sk += (tgt - m.sk) * .1;
      m.track.style.transform = `translate3d(${m.x.toFixed(2)}px,0,0) skewX(${m.sk.toFixed(2)}deg)`;
    });
  });
}

/* scramble */
function scrambleTitle(){
  const lines = $$('.ln>span', $('#ctTitle')), chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&/';
  const finals = lines.map(l => $$('.c', l).map(c => c.textContent));
  const cs = lines.map(l => $$('.c', l));
  gsap.from(cs.flat(), { yPercent: 115, duration: 1.1, ease: 'expo.out', stagger: .02 });
  if (reduce) return;
  const start = performance.now();
  const tick = now => {
    let done = true;
    cs.forEach((arr, li) => arr.forEach((c, i) => {
      const t = (now - start - li * 180 - i * 45) / 600;
      if (t < 1) { done = false; c.textContent = t < 0 ? chars[(Math.random() * chars.length) | 0] : (Math.random() < t ? finals[li][i] : chars[(Math.random() * chars.length) | 0]); }
      else c.textContent = finals[li][i];
    }));
    if (!done) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* language + copy */
$$('[data-lang]').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.lang === lang) return; lang = b.dataset.lang;
  try { localStorage.setItem('ktg-lang', lang); } catch (e) {}
  applyLang();
  if (window.ScrollTrigger) setTimeout(() => ScrollTrigger.refresh(), 80);
}));
$$('[data-copy]').forEach(b => b.addEventListener('click', async () => {
  const val = b.dataset.copy; let ok = false;
  try { await navigator.clipboard.writeText(val); ok = true; } catch (e) {
    const el = b.closest('.c-row').querySelector('.c-val'); const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
  if (ok) { setRoll(b, T().c_copied); setTimeout(() => setRoll(b, T().c_copy), 1400); }
}));

/* ================= boot ================= */
(async function boot(){
  setProgress(15);
  const guard = setTimeout(() => setProgress(100), 8000);
  window.__glOk = await initHero().catch(err => { console.error(err); return false; });
  try { initScroll(); } catch (err) { console.error(err); }
  clearTimeout(guard);
  await finishLoader();
  if (heroStage) heroStage.playIntro();
  if (!reduce) {
    gsap.from('.hfade', { opacity: 0, y: 16, duration: 1, ease: 'power3.out', stagger: .08, delay: .5 });
    gsap.from('.nav > *', { opacity: 0, y: -14, duration: 1, ease: 'power3.out', stagger: .08, delay: .3 });
    gsap.from('#bezel', { scale: .7, opacity: 0, rotate: -60, duration: 2.4, ease: 'expo.out' });
  }
})();
</script>
